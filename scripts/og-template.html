<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("file://FONTS_DIR/newsreader-latin-wght-normal.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("file://FONTS_DIR/public-sans-latin-wght-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("file://FONTS_DIR/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 500;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: #fafaf7;
        color: #1c1b19;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 96px;
        font-family: "Public Sans", sans-serif;
      }

      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #0f5e73;
        margin-bottom: 24px;
      }

      h1 {
        font-family: "Newsreader", serif;
        font-weight: 600;
        font-size: 64px;
        line-height: 1.15;
        margin-bottom: 24px;
      }

      p {
        font-size: 28px;
        color: #57534e;
        max-width: 900px;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">kaufon.github.io</p>
    <h1 id="title">TITLE</h1>
    <p id="subtitle">SUBTITLE</p>
  </body>
</html>
